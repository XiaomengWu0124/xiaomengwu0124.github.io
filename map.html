  <style>
    /* Map page: content fills viewport */
    .map-page .content {
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: none;
    }

    .map-header {
      padding: var(--space-md) var(--space-lg);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .map-header h1 {
      font-size: 1.6rem;
      margin-bottom: 0.25rem;
    }

    .map-header p {
      font-size: 0.85rem;
      color: var(--color-text-light);
      margin-bottom: 0;
    }

    #map {
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    /* Custom marker */
    .map-marker {
      width: 12px;
      height: 12px;
      background: var(--color-accent);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .map-marker:hover {
      transform: scale(1.4);
    }

    /* Popup styling */
    .leaflet-popup-content-wrapper {
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      font-family: var(--font-sans);
      padding: 0;
      overflow: hidden;
    }

    .leaflet-popup-content {
      margin: 0;
      min-width: 240px;
      max-width: 320px;
    }

    .leaflet-popup-tip {
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .popup-card {
      overflow: hidden;
    }

    .popup-card__img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .popup-card__body {
      padding: 1rem 1.2rem;
    }

    .popup-card__place {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .popup-card__date {
      font-size: 0.7rem;
      color: var(--color-text-faint);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .popup-card__thought {
      font-size: 0.85rem;
      color: var(--color-text-light);
      line-height: 1.6;
      margin-bottom: 0;
    }

    /* No-image variant */
    .popup-card--no-img .popup-card__body {
      padding: 1rem 1.2rem;
    }

    /* Zoom hint */
    .map-hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      font-family: var(--font-sans);
      font-size: 0.75rem;
      color: var(--color-text-light);
      background: rgba(255,255,255,0.92);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.1);
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .map-hint--hidden {
      opacity: 0;
    }

    /* Leaflet zoom control restyle */
    .leaflet-control-zoom a {
      font-family: var(--font-sans) !important;
      color: var(--color-text) !important;
      border-color: var(--color-border) !important;
    }

    @media (max-width: 768px) {
      .map-header {
        padding: var(--space-sm) var(--space-md);
        padding-top: calc(var(--space-sm) + 50px);
      }

      .map-header h1 {
        font-size: 1.3rem;
      }

      .leaflet-popup-content {
        min-width: 200px;
        max-width: 260px;
      }

      .popup-card__img {
        height: 140px;
      }
    }
  </style>

    // ==========================================
    //  MAP SETUP
    // ==========================================

    // Muted, clean tile layer (CartoDB Positron — matches the site aesthetic)
    var map = L.map('map', {
      center: [35, 30],
      zoom: 3,
      minZoom: 2,
      maxZoom: 18,
      zoomControl: true,
      scrollWheelZoom: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    // ==========================================
    //  MARKERS
    // ==========================================

    var markers = [];
    var accentColor = getComputedStyle(document.documentElement).getPropertyValue('--color-accent').trim() || '#c45a3c';

    places.forEach(function (p) {
      var icon = L.divIcon({
        className: '',
        html: '<div class="map-marker"></div>',
        iconSize: [12, 12],
        iconAnchor: [6, 6],
        popupAnchor: [0, -8]
      });

      var marker = L.marker([p.lat, p.lng], { icon: icon });

      // Build popup HTML
      var popupHtml = '<div class="popup-card' + (p.image ? '' : ' popup-card--no-img') + '">';
      if (p.image) {
        popupHtml += '<img class="popup-card__img" src="' + p.image + '" alt="' + p.place + '">';
      }
      popupHtml += '<div class="popup-card__body">';
      popupHtml += '<div class="popup-card__place">' + p.place + '</div>';
      if (p.date) {
        popupHtml += '<div class="popup-card__date">' + p.date + '</div>';
      }
      if (p.thought) {
        popupHtml += '<p class="popup-card__thought">' + p.thought + '</p>';
      }
      popupHtml += '</div></div>';

      marker.bindPopup(popupHtml, {
        maxWidth: 320,
        minWidth: 200,
        closeButton: true
      });

      // Store minZoom on marker for filtering
      marker._placeMinZoom = p.minZoom || 0;
      markers.push(marker);
    });

    // Show/hide markers based on zoom level
    function updateMarkers() {
      var zoom = map.getZoom();
      markers.forEach(function (m) {
        if (zoom >= m._placeMinZoom) {
          if (!map.hasLayer(m)) map.addLayer(m);
        } else {
          if (map.hasLayer(m)) map.removeLayer(m);
        }
      });
    }

    map.on('zoomend', updateMarkers);
    updateMarkers();

    // ==========================================
    //  HINT — fade out after first interaction
    // ==========================================
    var hint = document.getElementById('mapHint');
    var hintDismissed = false;

    function dismissHint() {
      if (!hintDismissed) {
        hintDismissed = true;
        hint.classList.add('map-hint--hidden');
      }
    }

    map.on('zoomstart', dismissHint);
    map.on('movestart', dismissHint);

  })();
